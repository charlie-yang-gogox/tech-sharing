<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Sharing · gogox</title>
  <style>
    :root {
      --bg: #0c0e12;
      --panel: #14171f;
      --border: #232733;
      --text: #e6e9ef;
      --muted: #9aa3b2;
      --amber: #fbbf24;
      --sky: #7dd3fc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(1200px 600px at 50% -10%, #16202e 0%, var(--bg) 55%);
      color: var(--text);
      font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Segoe UI", sans-serif;
      min-height: 100vh;
      padding: 8vh 24px 12vh;
      line-height: 1.6;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    .kicker {
      font-family: "JetBrains Mono", "SF Mono", Menlo, monospace;
      font-size: 12px; font-weight: 800; letter-spacing: 2px;
      color: var(--amber); text-transform: uppercase;
    }
    h1 { font-size: clamp(32px, 6vw, 52px); font-weight: 850; margin: 10px 0 8px; letter-spacing: -0.5px; }
    .sub { color: var(--muted); font-size: 16px; margin-bottom: 44px; }
    .sessions { display: flex; flex-direction: column; gap: 16px; }
    .card {
      display: block; text-decoration: none; color: inherit;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 22px 24px;
      transition: border-color .15s ease, transform .15s ease, background .15s ease;
    }
    .card:hover { border-color: rgba(251,191,36,.55); transform: translateY(-2px); background: #171b24; }
    .card-date {
      font-family: "JetBrains Mono", "SF Mono", Menlo, monospace;
      font-size: 12.5px; color: var(--sky); font-weight: 700; letter-spacing: .5px;
    }
    .card-title { font-size: 21px; font-weight: 800; margin: 6px 0 6px; }
    .card-desc { color: var(--muted); font-size: 14.5px; }
    .card-go { margin-top: 14px; font-size: 13px; font-weight: 800; color: var(--amber); }
    footer { margin-top: 56px; color: #5b6472; font-size: 12.5px;
      font-family: "JetBrains Mono", "SF Mono", Menlo, monospace; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">▸ gogox · internal</div>
    <h1>Tech Sharing</h1>
    <p class="sub">技術分享存檔 · 每場一個資料夾，依日期排列。</p>

    <div class="sessions">
      <a class="card" href="2026-06-03-ggx-claude/">
        <div class="card-date">2026-06-03</div>
        <div class="card-title">gogox-claude · 三部曲</div>
        <div class="card-desc">從 Vibe Coding 到 Spec-Driven Development：用 Claude Code 打造端到端的 agentic 開發流程。</div>
        <div class="card-go">開啟投影片 →</div>
      </a>
    </div>

    <footer>gogox · Tech Sharing · Charlie Yang</footer>
  </div>
</body>
</html>
