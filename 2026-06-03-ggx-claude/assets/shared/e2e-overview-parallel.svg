      <!-- 🅰 Pipeline tickers · one moving dot per row, 4 different speeds + phases so they never sync.
           Each ticker travels from worktree (x=325) → /port:ff (490) → /dev:ff (640) → PR (770).
           Group is at SVG origin; CSS keyframe translates to (start x, row y) → (end x, row y). -->
      <g class="ov-ticker-layer">
        <g class="ov-ticker r1"><circle r="9" fill="#7dd3fc" opacity="0.28"/><circle r="4" fill="#7dd3fc"/></g>
