  <script type="application/ecmascript"><![CDATA[
    (function () {
      var svg = document.documentElement;
      function applyLang(lang) { svg.setAttribute('data-lang', lang === 'en' ? 'en' : 'zh'); }
      // Initial language sync with parent (same-origin)
      try {
        var pBody = window.parent && window.parent.document && window.parent.document.body;
        if (pBody && pBody.getAttribute('data-lang') === 'en') applyLang('en');
      } catch (e) {}
      window.addEventListener('message', function (e) {
        if (e && e.data && e.data.type === 'e2e-lang' && e.data.lang) applyLang(e.data.lang);
      });
    })();
  ]]></script>
