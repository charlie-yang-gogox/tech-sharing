      <!-- 🅱 Convergence pulse layer · small green pulses flowing toward "N concurrent PRs" -->
      <g class="ov-conv-pulse-layer" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round">
        <path class="cp cp1" pathLength="100" d="M 810 120 Q 870 120, 900 200"/>
        <path class="cp cp2" pathLength="100" d="M 810 180 Q 870 180, 900 200"/>
