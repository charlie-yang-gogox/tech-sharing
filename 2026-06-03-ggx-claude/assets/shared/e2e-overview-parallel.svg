<?xml version="1.0" encoding="UTF-8"?>
<!--
  SSOT · /ggx-dispatcher parallelism diagram (Part 2 of E2E overview).
  Referenced by:
    - /assets/shared/e2e-overview.html  (composes Part 1 + Part 2 + legend + details)
  Animations and styles are self-contained · no host CSS required.
-->
<svg viewBox="0 0 1240 420" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:auto; display:block;" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif">
  <defs>
    <style><![CDATA[

      /* Hover interactivity */
      a { cursor: pointer; }
      a rect, a text { transition: filter 0.12s ease; }
      a:hover rect { filter: brightness(1.45); }
      a:hover text { filter: brightness(1.2); }

      /* ===== Bilingual labels · default shows .zh; host flips via svg[data-lang="en"] ===== */

      /* === 4 pipeline tickers · different speeds + phases = "4 independent clocks" === */
      @keyframes ov-ticker-r1 {
        0%   { transform: translate(325px, 120px); opacity: 0; }
        6%   { opacity: 1; }
        88%  { opacity: 1; }
        100% { transform: translate(770px, 120px); opacity: 0; }
      }
      @keyframes ov-ticker-r2 {
        0%   { transform: translate(325px, 180px); opacity: 0; }
        6%   { opacity: 1; }
        88%  { opacity: 1; }
        100% { transform: translate(770px, 180px); opacity: 0; }
      }
      @keyframes ov-ticker-r3 {
        0%   { transform: translate(325px, 240px); opacity: 0; }
        6%   { opacity: 1; }
        88%  { opacity: 1; }
        100% { transform: translate(770px, 240px); opacity: 0; }
      }
      @keyframes ov-ticker-r4 {
        0%   { transform: translate(325px, 300px); opacity: 0; }
        6%   { opacity: 1; }
        88%  { opacity: 1; }
        100% { transform: translate(770px, 300px); opacity: 0; }
      }
      .ov-ticker { opacity: 0; }
      .ov-ticker.r1 { animation: ov-ticker-r1 7.0s linear   0s    infinite; }
      .ov-ticker.r2 { animation: ov-ticker-r2 9.2s linear  -2.6s  infinite; }
      .ov-ticker.r3 { animation: ov-ticker-r3 6.4s linear  -4.5s  infinite; }
      .ov-ticker.r4 { animation: ov-ticker-r4 8.3s linear  -1.4s  infinite; }

      /* === Convergence pulses · green dots flowing toward (900, 200) === */
      .ov-conv-pulse-layer { mix-blend-mode: screen; }
      .ov-conv-pulse-layer path {
        stroke-dasharray: 5 95;
        animation: ov-conv-pulse 2.6s linear infinite;
      }
      @keyframes ov-conv-pulse {
        from { stroke-dashoffset: 100; }
        to   { stroke-dashoffset: 0; }
      }
      .ov-conv-pulse-layer .cp1 { animation-delay:  0s;    }
      .ov-conv-pulse-layer .cp2 { animation-delay: -0.65s; }
      .ov-conv-pulse-layer .cp3 { animation-delay: -1.30s; }
      .ov-conv-pulse-layer .cp4 { animation-delay: -1.95s; }

      @media (prefers-reduced-motion: reduce) {
        .ov-ticker, .ov-conv-pulse-layer path { animation: none !important; }
        .ov-ticker { opacity: 0 !important; }
      }
    ]]></style>
        <marker id="arrFan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/></marker>
        <marker id="arrConv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/></marker>
        <marker id="arrBug" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/></marker>
        <marker id="arrFeat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#86efac"/></marker>
  </defs>

<text x="1235" y="22" text-anchor="end" fill="#6b7280" font-size="11" letter-spacing="2">TIME →</text>

      <!-- /ggx-dispatcher chip at top-left -->
      <a target="_top" href="../../part3/details/ggx-dispatcher.html"
         data-tip-tag="ORCHESTRATOR"
         data-tip-name="/ggx-dispatcher"
         data-tip-desc-zh="A batch worker. Pulls a Linear queue → spawns /port:ff · /bug:ff · /dev:ff in parallel by label → reports activity every 30 seconds, unattended through a whole batch."
         data-tip-desc-en="A batch worker. Pulls a Linear queue → spawns /port:ff · /bug:ff · /dev:ff in parallel by label → reports activity every 30 seconds, unattended through a whole batch.">
        <rect x="20" y="38" width="190" height="44" rx="9" fill="rgba(125,211,252,0.10)" stroke="#7dd3fc" stroke-width="1.6"/>
        <text x="115" y="58" text-anchor="middle" fill="#7dd3fc" font-size="13" font-weight="800" font-family="SF Mono, Menlo, monospace">/ggx-dispatcher</text>
<text x="115" y="74" text-anchor="middle" fill="#7dd3fc" font-size="9.5" opacity="0.8" letter-spacing="0.4">one run · fans out to N</text>
      </a>

      <!-- Worktree column header — anchors the 4 ../FE-XXX labels to worktree-skills (replaces the bottom foundation band) -->
      <a target="_top" href="../../part3/details/worktree-skills.html"
         data-tip-tag="FOUNDATION"
         data-tip-name="Worktree skills"
         data-tip-desc-zh="Each ../&lt;TICKET-ID&gt; is its own git worktree — the physical isolation that lets the rows run in parallel below."
         data-tip-desc-en="Each ../&lt;TICKET-ID&gt; is its own git worktree — the physical isolation that lets the rows run in parallel below.">
        <rect x="240" y="46" width="200" height="28" rx="8" fill="rgba(125,211,252,0.06)" stroke="#7dd3fc" stroke-width="1" stroke-dasharray="3 2"/>
        <text x="340" y="65" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="700" letter-spacing="0.3" font-family="SF Mono, Menlo, monospace">▼ worktree-skills</text>
      </a>
<text x="340" y="89" text-anchor="middle" fill="#6b7280" font-size="9.5" letter-spacing="0.3">each ../&lt;TICKET-ID&gt; is one git worktree · keeps rows isolated</text>

      <!-- Vertical bus going down from dispatcher to last row -->
      <path d="M 115 82 L 115 310" stroke="#7dd3fc" stroke-width="1.4" fill="none" stroke-dasharray="0" opacity="0.7"/>

      <!-- Fanout arrows from bus to each row (4 rows) -->
      <g fill="none" stroke="#7dd3fc" stroke-width="1.4" opacity="0.9">
        <line x1="115" y1="120" x2="245" y2="120" marker-end="url(#arrFan)"/>
        <line x1="115" y1="180" x2="245" y2="180" marker-end="url(#arrFan)"/>
