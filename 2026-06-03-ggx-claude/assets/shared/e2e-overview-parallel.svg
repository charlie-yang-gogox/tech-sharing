<text x="920" y="213" fill="#9ca3af" font-size="11">from a single dispatcher run</text>

      <!-- ===== Route legend · /route picks a lane by ticket label ===== -->
      <g font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif">
